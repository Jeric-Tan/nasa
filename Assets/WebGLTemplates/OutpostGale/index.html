<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #B9502A; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #B9502A; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #E9773E; color: #FFF6EA; font: 800 20px "Nunito", system-ui, sans-serif; }
    #loading h1 { margin: 0; font-size: 56px; letter-spacing: 1px; text-shadow: 0 4px 0 #2A1A2E; }
    #bar { width: min(420px, 80vw); height: 22px; border: 4px solid #2A1A2E; border-radius: 14px; background: #FFF6EA; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #F2B705; transition: width .2s; }
    #warning { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); max-width: 90vw; display: none;
      background: #FFF6EA; color: #2A1A2E; border: 3px solid #2A1A2E; border-radius: 12px; padding: 10px 14px; font: 700 15px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><h1>Outpost Gale</h1><div>Getting the base ready…</div><div id="bar"><div id="fill"></div></div></div>
  <div id="warning"></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    function showBanner(msg, type) {
      if (type !== 'error') { console.warn(msg); return; }
      var w = document.querySelector("#warning");
      w.textContent = msg; w.style.display = "block";
    }
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: showBanner,
    };
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    }
    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) { showBanner(String(message), 'error'); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
